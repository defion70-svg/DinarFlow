name: Build DinarFlow APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare consistent signing keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore.tmp
            if keytool -list -keystore debug.keystore.tmp -storepass android >/dev/null 2>&1; then
              mv debug.keystore.tmp debug.keystore
              echo "Loaded debug.keystore from repository debug.keystore.base64"
            else
              rm -f debug.keystore.tmp
            fi
          fi

          if [ ! -f debug.keystore ] && [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore.tmp
            if keytool -list -keystore debug.keystore.tmp -storepass android >/dev/null 2>&1; then
              mv debug.keystore.tmp debug.keystore
              echo "Loaded debug.keystore from secret DEBUG_KEYSTORE_BASE64"
            else
              rm -f debug.keystore.tmp
            fi
          fi

          if [ ! -f debug.keystore ]; then
            ASSET_ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "signing-keystore-v1") | .assets[] | select(.name == "debug.keystore") | .id' \
              2>/dev/null | head -n 1 || true)
            if [ -n "$ASSET_ID" ]; then
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > debug.keystore.tmp || true
              if keytool -list -keystore debug.keystore.tmp -storepass android >/dev/null 2>&1; then
                mv debug.keystore.tmp debug.keystore
                echo "Loaded persistent debug.keystore from draft release signing-keystore-v1"
              else
                rm -f debug.keystore.tmp
              fi
            fi
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new persistent debug.keystore"

            RELEASE_ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "signing-keystore-v1") | .id' \
              2>/dev/null | head -n 1 || true)
            if [ -n "$RELEASE_ID" ]; then
              gh api -X POST "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=debug.keystore" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @debug.keystore >/dev/null || \
                echo "::warning::Could not upload debug.keystore to signing-keystore-v1 draft release."
            else
              gh release create signing-keystore-v1 debug.keystore \
                --draft \
                --title "Internal Debug Signing Key" \
                --notes "Автоматический ключ подписи DinarFlow для обновлений APK поверх старых версий. Не удаляйте." || \
                echo "::warning::Could not create signing-keystore-v1 draft release (check Read and write permissions)."
            fi
          fi

          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true

      - name: Build APK
        run: gradle :app:assembleDebug -PciRunNumber=${{ github.run_number }} --no-daemon

      - name: Package versioned APK
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          APK_NAME="DinarFlow-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinarFlow-APK-${{ env.VERSION_TAG }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.VERSION_TAG }}" >/dev/null 2>&1; then
            gh release upload "${{ env.VERSION_TAG }}" "${{ env.APK_NAME }}" --clobber
          else
            gh release create "${{ env.VERSION_TAG }}" "${{ env.APK_NAME }}" \
              --latest \
              --title "DinarFlow ${{ env.VERSION_TAG }}" \
              --notes "Версия ${{ env.VERSION_TAG }} (versionCode ${{ env.VERSION_CODE }}). Обновляется поверх предыдущей версии при одинаковой подписи."
          fi
